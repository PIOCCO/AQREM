name: Build platform container images

on:
  workflow_dispatch:
  push:
    paths:
      - "infra/model-gateway/**"
      - ".github/workflows/build-platform-images.yml"

permissions:
  id-token: write
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute tag
        id: tag
        run: echo "value=0.0.0+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_LOGIN_SERVER }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push gateway
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/aqrem-model-gateway:${{ steps.tag.outputs.value }}"
          docker build -t "$IMAGE" infra/model-gateway
          docker push "$IMAGE"
          echo "Pushed $IMAGE (enable ACR vulnerability scanning / Notation sign in prod)"
