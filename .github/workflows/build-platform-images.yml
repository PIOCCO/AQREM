name: Build platform container images

on:
  workflow_dispatch:
  push:
    paths:
      - "infra/model-gateway/**"
      - ".github/workflows/build-platform-images.yml"

permissions:
  id-token: write
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Compute tag
        id: tag
        run: echo "value=0.0.0+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEV }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_DEV }}
      - name: ACR login (OIDC)
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - name: Build and push gateway
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/aqrem-model-gateway:${{ steps.tag.outputs.value }}"
          docker build -t "$IMAGE" infra/model-gateway
          docker push "$IMAGE"
          echo "Pushed $IMAGE"
