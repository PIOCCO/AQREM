<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No third-party font CDN: private-network deployments must not call public hosts. Inter is used if installed locally, else system-ui. -->
    <title>AQREM</title>
    <meta name="description" content="Evidence-backed questionnaire responses" />
    <meta name="theme-color" content="#141414" />
    <meta property="og:title" content="AQREM" />
    <meta property="og:description" content="Evidence-backed questionnaire responses" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (function () {
        var key = "aqrem_theme";
        var stored = localStorage.getItem(key);
        var resolved = "dark";
        if (stored === "light") resolved = "light";
        else if (stored === "dark") resolved = "dark";
        else if (stored === "system") {
          resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.dataset.theme = resolved;
        var sidebarKey = "aqrem_sidebar_collapsed";
        var sidebarCollapsed = localStorage.getItem(sidebarKey) === "1";
        document.documentElement.dataset.sidebarCollapsed = sidebarCollapsed ? "true" : "false";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
