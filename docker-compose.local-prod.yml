# Production-like local stack (no Azure subscription). See scripts/start-local-prod-stack.sh
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aqrem
      POSTGRES_PASSWORD: aqrem
      POSTGRES_DB: aqrem
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local_prod:/var/lib/postgresql/data
      - ./infra/dev/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqrem -d aqrem"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    ports:
      - "10000:10000"
    volumes:
      - azurite_local_prod:/data

  fake-azure-openai:
    build:
      context: ./infra/dev/fake_azure_openai
    environment:
      FAKE_EMBED_DIM: "384"
      FAKE_AZURE_MODE: ok
    ports:
      - "8099:8099"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  model-gateway:
    build:
      context: ./infra/model-gateway
    environment:
      GATEWAY_ENV: local
      AZURE_OPENAI_ENDPOINT: http://fake-azure-openai:8099
      AZURE_OPENAI_API_KEY: fake-local-key
      AZURE_OPENAI_USE_MANAGED_IDENTITY: "false"
      DATABASE_URL: postgresql://aqrem:aqrem@postgres:5432/aqrem
      DATABASE_USE_ENTRA: "false"
      DEPLOYMENT_ALIAS_CHAT: chat-default
      DEPLOYMENT_ALIAS_EMBEDDINGS: embeddings-default
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      fake-azure-openai:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - .env
    volumes:
      - ./infra/dev:/app/infra/dev:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - upload_data_local_prod:/data/uploads
    environment:
      APP_ENV: production
      LOCAL_PROD_STACK: "true"
      CONTAINER_ROLE: api
      SECRET_KEY: local-prod-stack-secret-key-32chars-min
      DATABASE_URL: postgresql+psycopg://aqrem:aqrem@postgres:5432/aqrem
      REDIS_URL: redis://redis:6379/0
      # Set PUBLIC_BASE_URL to the URL you open in the browser (e.g. Tailscale http://100.x.x.x:5173).
      # CORS allows that origin automatically from PUBLIC_BASE_URL; add extras below if needed.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      # Shared disk uploads (API + worker). Overrides .env Azurite/127.0.0.1 strings that break inside containers.
      LOCAL_UPLOAD_DIR: /data/uploads
      AZURE_STORAGE_CONNECTION_STRING: ""
      LLM_PROVIDER: gateway
      GATEWAY_URL: http://model-gateway:8080
      GATEWAY_API_KEY: local_dev_gateway_key_00000001
      EMBEDDING_DIMENSIONS: "384"
      LICENSING_TEST_MODE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
      model-gateway:
        condition: service_started

  worker-beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file:
      - .env
    environment:
      APP_ENV: production
      LOCAL_PROD_STACK: "true"
      CONTAINER_ROLE: worker
      DATABASE_URL: postgresql+psycopg://aqrem:aqrem@postgres:5432/aqrem
      REDIS_URL: redis://redis:6379/0
      # Same as worker — beat imports app.celery_app → production Settings requires gateway.
      LLM_PROVIDER: gateway
      GATEWAY_URL: http://model-gateway:8080
      GATEWAY_API_KEY: local_dev_gateway_key_00000001
      EMBEDDING_DIMENSIONS: "384"
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file:
      - .env
    volumes:
      - ./infra/dev:/app/infra/dev:ro
      - upload_data_local_prod:/data/uploads
    environment:
      APP_ENV: production
      LOCAL_PROD_STACK: "true"
      CONTAINER_ROLE: worker
      DATABASE_URL: postgresql+psycopg://aqrem:aqrem@postgres:5432/aqrem
      REDIS_URL: redis://redis:6379/0
      LOCAL_UPLOAD_DIR: /data/uploads
      AZURE_STORAGE_CONNECTION_STRING: ""
      LLM_PROVIDER: gateway
      GATEWAY_URL: http://model-gateway:8080
      GATEWAY_API_KEY: local_dev_gateway_key_00000001
      EMBEDDING_DIMENSIONS: "384"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
      model-gateway:
        condition: service_started

  web:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      # Do not bake VITE_API_BASE=127.0.0.1 — breaks Tailscale/remote browsers.
      # Runtime apiBase.ts uses window.location.hostname:8000 when served on :5173.
      VITE_PUBLIC_APP_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:5173}
    command: sh -c "npm ci && npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata_local_prod:
  azurite_local_prod:
  upload_data_local_prod:
