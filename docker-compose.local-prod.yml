# Production-like local stack (no Azure subscription). See scripts/start-local-prod-stack.sh
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aqrem
      POSTGRES_PASSWORD: aqrem
      POSTGRES_DB: aqrem
      # Least-privilege roles (created on a fresh volume by init/02-least-privilege.sh; for an EXISTING
      # volume run ./scripts/pi-db-least-privilege.sh once). "aqrem" stays the admin/superuser only.
      AQREM_MIGRATOR_DB_PASSWORD: ${AQREM_MIGRATOR_DB_PASSWORD:?set AQREM_MIGRATOR_DB_PASSWORD in .env}
      AQREM_APP_DB_PASSWORD: ${AQREM_APP_DB_PASSWORD:?set AQREM_APP_DB_PASSWORD in .env}
      AQREM_TENANT_DB_PASSWORD: ${AQREM_TENANT_DB_PASSWORD:?set AQREM_TENANT_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local_prod:/var/lib/postgresql/data
      - ./infra/dev/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./scripts/sql:/aqrem-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqrem -d aqrem"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --skipApiVersionCheck --blobHost 0.0.0.0 --blobPort 10000
    ports:
      - "10000:10000"
    volumes:
      - azurite_local_prod:/data

  fake-azure-openai:
    build:
      context: ./infra/dev/fake_azure_openai
    environment:
      FAKE_EMBED_DIM: "384"
      FAKE_AZURE_MODE: ok
    ports:
      - "8099:8099"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  model-gateway:
    build:
      context: ./infra/model-gateway
    environment:
      GATEWAY_ENV: local
      AZURE_OPENAI_ENDPOINT: http://fake-azure-openai:8099
      AZURE_OPENAI_API_KEY: fake-local-key
      AZURE_OPENAI_USE_MANAGED_IDENTITY: "false"
      DATABASE_URL: postgresql://aqrem:aqrem@postgres:5432/aqrem
      DATABASE_USE_ENTRA: "false"
      DEPLOYMENT_ALIAS_CHAT: chat-default
      DEPLOYMENT_ALIAS_EMBEDDINGS: embeddings-default
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      fake-azure-openai:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - .env
    volumes:
      - ./infra/dev:/app/infra/dev:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - upload_data_local_prod:/data/uploads
    environment:
      APP_ENV: production
      LOCAL_PROD_STACK: "true"
      CONTAINER_ROLE: api
      MIGRATION_DATABASE_URL: postgresql+psycopg://aqrem_migrator:${AQREM_MIGRATOR_DB_PASSWORD}@postgres:5432/aqrem
      SECRET_KEY: local-prod-stack-secret-key-32chars-min
      DATABASE_URL: postgresql+psycopg://aqrem_app:${AQREM_APP_DB_PASSWORD}@postgres:5432/aqrem
      TENANT_DATABASE_URL: postgresql+psycopg://aqrem_tenant:${AQREM_TENANT_DB_PASSWORD}@postgres:5432/aqrem
      REDIS_URL: redis://redis:6379/0
      # Set PUBLIC_BASE_URL to the URL you open in the browser (e.g. Tailscale http://100.x.x.x:5173).
      # CORS allows that origin automatically from PUBLIC_BASE_URL; add extras below if needed.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      # Shared disk uploads (API + worker). Overrides .env Azurite/127.0.0.1 strings that break inside containers.
      LOCAL_UPLOAD_DIR: /data/uploads
      AZURE_STORAGE_CONNECTION_STRING: ""
      # Azure OpenAI for chat and embeddings (default). Production refuses mock/fake providers.
      # Values come from .env; missing ones stop startup with a message naming the variable.
      LLM_PROVIDER: ${LLM_PROVIDER:-azure}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_USE_MANAGED_IDENTITY: ${AZURE_OPENAI_USE_MANAGED_IDENTITY:-false}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AZURE_OPENAI_EMBEDDING_SEND_DIMENSIONS: ${AZURE_OPENAI_EMBEDDING_SEND_DIMENSIONS:-true}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      LLM_MAX_ANSWER_TOKENS: ${LLM_MAX_ANSWER_TOKENS:-1024}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      # Legacy direct-OpenAI option (LLM_PROVIDER=openai)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      DEBUG_RAG: ${DEBUG_RAG:-true}
      LICENSING_TEST_MODE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
  worker-beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file:
      - .env
    environment:
      APP_ENV: production
      LOCAL_PROD_STACK: "true"
      CONTAINER_ROLE: worker
      DATABASE_URL: postgresql+psycopg://aqrem_app:${AQREM_APP_DB_PASSWORD}@postgres:5432/aqrem
      TENANT_DATABASE_URL: postgresql+psycopg://aqrem_tenant:${AQREM_TENANT_DB_PASSWORD}@postgres:5432/aqrem
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-azure}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_USE_MANAGED_IDENTITY: ${AZURE_OPENAI_USE_MANAGED_IDENTITY:-false}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AZURE_OPENAI_EMBEDDING_SEND_DIMENSIONS: ${AZURE_OPENAI_EMBEDDING_SEND_DIMENSIONS:-true}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      LLM_MAX_ANSWER_TOKENS: ${LLM_MAX_ANSWER_TOKENS:-1024}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      # Legacy direct-OpenAI option (LLM_PROVIDER=openai)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      DEBUG_RAG: ${DEBUG_RAG:-true}
      CELERY_BEAT_SCHEDULE_FILE: /tmp/celerybeat-schedule
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file:
      - .env
    volumes:
      - ./infra/dev:/app/infra/dev:ro
      - upload_data_local_prod:/data/uploads
    environment:
      APP_ENV: production
      LOCAL_PROD_STACK: "true"
      CONTAINER_ROLE: worker
      DATABASE_URL: postgresql+psycopg://aqrem_app:${AQREM_APP_DB_PASSWORD}@postgres:5432/aqrem
      TENANT_DATABASE_URL: postgresql+psycopg://aqrem_tenant:${AQREM_TENANT_DB_PASSWORD}@postgres:5432/aqrem
      REDIS_URL: redis://redis:6379/0
      LOCAL_UPLOAD_DIR: /data/uploads
      AZURE_STORAGE_CONNECTION_STRING: ""
      LLM_PROVIDER: ${LLM_PROVIDER:-azure}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_USE_MANAGED_IDENTITY: ${AZURE_OPENAI_USE_MANAGED_IDENTITY:-false}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AZURE_OPENAI_EMBEDDING_SEND_DIMENSIONS: ${AZURE_OPENAI_EMBEDDING_SEND_DIMENSIONS:-true}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      LLM_MAX_ANSWER_TOKENS: ${LLM_MAX_ANSWER_TOKENS:-1024}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      # Legacy direct-OpenAI option (LLM_PROVIDER=openai)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      DEBUG_RAG: ${DEBUG_RAG:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        # V1 employee UI by default; set VITE_PRODUCT_V1=false in .env only for legacy UI.
        VITE_PRODUCT_V1: ${VITE_PRODUCT_V1:-true}
        VITE_BUILD_ID: ${VITE_BUILD_ID:-}
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_PUBLIC_APP_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:5173}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata_local_prod:
  azurite_local_prod:
  upload_data_local_prod:
