server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Optional same-origin API proxy (dedicated Azure envs set API_UPSTREAM; local compose does not).
    include /etc/nginx/api-proxy/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /build-info.json {
        add_header Cache-Control "no-store";
    }
}
